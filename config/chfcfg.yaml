info:
  version: 1.0.3
  description: CHF initial local configuration

configuration:
  chfName: CHF # the name of this CHF
  sbi: # Service-based interface information
    scheme: http # the protocol for sbi (http or https)
    # registerIPv4: service-enterprise1-slice1-chf.ns-enterprise1.svc.cluster.local # IP used to register to NRF
    # bindingIPv4: service-enterprise1-slice1-chf.ns-enterprise1.svc.cluster.local # IP used to bind the service
    registerIPv4: service-enterprise1-slice1-convergedcharging.ns-enterprise1.svc.cluster.local # IP used to register to NRF
    bindingIPv4: service-enterprise1-slice1-convergedcharging.ns-enterprise1.svc.cluster.local # IP used to bind the service
    fqdn: service-enterprise1-slice1-convergedcharging.ns-enterprise1.svc.cluster.local
    port: 8080 # port used to bind the service
    tls: # the local path of TLS key
      pem: cert/chf.pem # CHF TLS Certificate
      key: cert/chf.key # CHF TLS Private key
  nrfUri: http://service-enterprise1-slice1-nfmanagement.ns-enterprise1.svc.cluster.local:8080 # a valid URI of NRF
  nrfCertPem: cert/nrf.pem # NRF Certificate
  serviceNameList: # the SBI services provided by this CHF, refer to TS 32.291
    - nchf-convergedcharging # Nchf_AMPolicyControl service
  mongodb: # the mongodb connected by this CHF
    name: free5gc # name of the mongodb
    url: mongodb://db:27017 # a valid URL of the mongodb
  quotaValidityTime: 10000
  volumeLimit: 50000
  volumeLimitPDU: 10000
  volumeThresholdRate: 0.8
  cgf:
    enable: true
    hostIPv4: 172.26.0.253
    port: 2121
    listenPort: 2122
    tls:
      pem: cert/chf.pem
      key: cert/chf.key
    cdrFilePath: /tmp
  abmfDiameter:
    protocol: tcp
    hostIPv4: service-enterprise1-slice1-convergedcharging.ns-enterprise1.svc.cluster.local
    port: 3868
    tls:
      pem: cert/chf.pem
      key: cert/chf.key
  rfDiameter:
    protocol: tcp
    hostIPv4: service-enterprise1-slice1-convergedcharging.ns-enterprise1.svc.cluster.local
    port: 3869
    tls:
      pem: cert/chf.pem # CHF TLS Certificate
      key: cert/chf.key # CHF TLS Private key
  plmnSupportList: # the PLMNs (Public land mobile network) list supported by this AMF
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 001 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 01 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      snssaiList: # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 19CDE1 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd:  # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
    - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
        mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      snssaiList: # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 010203 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 112233 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)

logger: # log output setting
  enable: true # true or false
  level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
  reportCaller: false # enable the caller report or not, value: true or false
